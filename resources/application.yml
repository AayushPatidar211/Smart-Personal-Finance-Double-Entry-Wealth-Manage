# ==============================================================================
# FinWise AI — Multi-Profile Application Configuration (Common / Base)
# ==============================================================================
spring:
  application:
    name: finwise-ai
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA & Hibernate Defaults
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  # Flyway Migration Automation
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Spring Batch Configuration
  batch:
    job:
      enabled: false # Do not auto-run all jobs on application boot
    jdbc:
      initialize-schema: always

  # Quartz Scheduler Configuration
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.threadPool.threadCount: 10
      org.quartz.jobStore.isClustered: true

# Security & JWT Configuration
finwise:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      access-token-expiration-ms: 900000       # 15 minutes
      refresh-token-expiration-ms: 604800000   # 7 days
      cookie-domain: ${COOKIE_DOMAIN:localhost}
      secure-cookie: ${SECURE_COOKIE:false}
    totp:
      issuer: "FinWise AI"
    rate-limit:
      login-capacity: 5
      login-refill-tokens: 5
      login-refill-duration-seconds: 60
      api-capacity: 100
      api-refill-tokens: 100
      api-refill-duration-seconds: 60

  # AI Engine Settings (Google Gemini 3.8 Flash)
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      temperature: 0.2
      max-output-tokens: 2048
      timeout-seconds: 25
      cache-ttl-hours: 24

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

# Springdoc OpenAPI 3 / Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
